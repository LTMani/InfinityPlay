<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <!-- Glowing Filters -->
    <filter id="bmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="tileGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="logoGrad2048" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="logoGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="logoGradText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Left: Stylized Merge Tile Icon -->
  <g transform="translate(6, 8)">
    <!-- Base Plate -->
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#0d1428" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" filter="url(#tileGlow)"/>

    <!-- Small 2 Tile -->
    <rect x="8" y="8" width="22" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="19" y="24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">2</text>

    <!-- Small 4 Tile -->
    <rect x="34" y="8" width="22" height="22" rx="5" fill="#0e7490" stroke="#06b6d4" stroke-width="1"/>
    <text x="45" y="24" fill="#ecfeff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">4</text>

    <!-- Merging Hero 2048 Tile -->
    <g filter="url(#bmGlow)">
      <rect x="8" y="34" width="48" height="22" rx="6" fill="url(#logoGrad2048)" stroke="#ffffff" stroke-width="1.2"/>
      <text x="32" y="49.5" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="0.5">2048</text>
    </g>
  </g>

  <!-- Right: Logo Typography -->
  <g transform="translate(82, 12)">
    <!-- Top Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="68" height="15" rx="7.5" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
      <text x="34" y="11" fill="#00f0ff" font-family="'Inter', sans-serif" font-size="8" font-weight="800" text-anchor="middle" letter-spacing="0.8">PUZZLE</text>

      <rect x="73" y="0" width="58" height="15" rx="7.5" fill="rgba(251, 191, 36, 0.12)" stroke="rgba(251, 191, 36, 0.3)" stroke-width="1"/>
      <text x="102" y="11" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="8" font-weight="800" text-anchor="middle" letter-spacing="0.8">TARGET 2048</text>
    </g>

    <!-- Brand Name -->
    <text x="0" y="38" fill="url(#logoGradText)" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5" filter="url(#bmGlow)">BLOCK MERGE</text>

    <!-- Slogan / Subtitle -->
    <text x="0" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="0.5">MERGE NUMBERS • REACH INFINITY</text>
  </g>
</svg>

