<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080a14"/>
      <stop offset="100%" style="stop-color:#0f141e"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff2d55"/>
      <stop offset="50%" style="stop-color:#00f0ff"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="320" height="180" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="300" height="160" rx="8" fill="none" stroke="rgba(0,240,255,0.15)" stroke-width="1"/>
  <line x1="20" y1="90" x2="140" y2="90" stroke="url(#laserGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="140,86 152,90 140,94" fill="#ff2d55" filter="url(#glow)"/>
  <polygon points="160,70 172,90 160,110" fill="#ffffff" opacity="0.8" transform="rotate(45 166 90)"/>
  <polygon points="180,70 192,90 180,110" fill="#d946ef" opacity="0.8"/>
  <circle cx="280" cy="90" r="12" fill="#00ff88" filter="url(#glow)"/>
  <circle cx="280" cy="90" r="6" fill="#ffffff"/>
  <text x="160" y="155" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#6b7b94" text-anchor="middle" letter-spacing="0.05em">LASER LOGIC</text>
</svg>