<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hwSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b132b"/>
      <stop offset="50%" style="stop-color:#1c2541"/>
      <stop offset="85%" style="stop-color:#3a506b"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="50%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="hwGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky & Horizon -->
  <rect width="320" height="180" fill="url(#hwSky)"/>
  
  <!-- Ocean Horizon & Sun Glow -->
  <circle cx="250" cy="85" r="28" fill="#fbbf24" opacity="0.6" filter="url(#hwGlow)"/>
  <rect x="0" y="95" width="320" height="20" fill="#0284c7" opacity="0.4"/>

  <!-- Coastal Landscape Terrain -->
  <path d="M0 180 L0 100 Q120 85 220 98 T320 110 L320 180 Z" fill="#0f172a" opacity="0.9"/>

  <!-- Multilane Highway Perspective Ribbon -->
  <path d="M-40 180 L140 100 L165 100 L280 180 Z" fill="url(#roadGrad)"/>
  <!-- Road White Edge Lines -->
  <line x1="-40" y1="180" x2="140" y2="100" stroke="#f8fafc" stroke-width="2.5" opacity="0.8"/>
  <line x1="280" y1="180" x2="165" y2="100" stroke="#f8fafc" stroke-width="2.5" opacity="0.8"/>
  <!-- Yellow Dashed Centerlines -->
  <line x1="120" y1="180" x2="152" y2="100" stroke="#fbbf24" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- Off-ramp Curve into Oasis Plaza -->
  <path d="M155 108 Q190 120 225 180" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Travel Plaza Service Area / Fuel Station -->
  <!-- Station Canopy Structure -->
  <g transform="translate(195, 105)">
    <!-- Columns -->
    <rect x="8" y="10" width="3" height="22" fill="#94a3b8"/>
    <rect x="38" y="10" width="3" height="22" fill="#94a3b8"/>
    <!-- Yellow Canopy Roof -->
    <polygon points="0,12 48,6 52,10 4,16" fill="url(#canopyGrad)" filter="url(#hwGlow)"/>
    <rect x="4" y="12" width="44" height="4" fill="#fbbf24"/>
    <!-- Fuel Dispensers -->
    <rect x="15" y="20" width="6" height="12" fill="#dc2626" rx="1"/>
    <rect x="28" y="20" width="6" height="12" fill="#16a34a" rx="1"/>
  </g>

  <!-- QuickMart Store Building -->
  <g transform="translate(245, 95)">
    <rect x="0" y="12" width="42" height="26" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <!-- Store Glass Front & Warm Lights -->
    <rect x="4" y="20" width="34" height="16" fill="#38bdf8" opacity="0.4"/>
    <!-- Neon Sign -->
    <rect x="6" y="8" width="30" height="5" fill="#06b6d4" filter="url(#hwGlow)"/>
  </g>

  <!-- High-Speed Supercar on Highway -->
  <g transform="translate(45, 128) scale(0.75)">
    <path d="M0 16 L12 4 L48 4 L64 12 L72 16 L72 26 L-4 26 Z" fill="#3b82f6"/>
    <path d="M14 6 L44 6 L40 14 L8 14 Z" fill="#93c5fd" opacity="0.85"/>
    <circle cx="12" cy="27" r="8" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="56" cy="27" r="8" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="68" cy="18" rx="3" ry="2" fill="#fef08a" filter="url(#hwGlow)"/>
    <!-- Headlight Beam -->
    <polygon points="72,18 130,12 130,32 72,22" fill="#fef08a" opacity="0.25"/>
  </g>

  <!-- Interstate 66 Route Shield Badge -->
  <g transform="translate(18, 14)">
    <path d="M0 6 C0 2 3 0 7 0 L25 0 C29 0 32 2 32 6 L32 16 C32 26 16 32 16 32 C16 32 0 26 0 16 Z" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5" filter="url(#hwGlow)"/>
    <path d="M2 5 C2 2 4 1 7 1 L25 1 C28 1 30 2 30 5 L30 10 L2 10 Z" fill="#dc2626"/>
    <text x="16" y="8" font-family="'Impact', 'Arial Black', sans-serif" font-size="6" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">INTERSTATE</text>
    <text x="16" y="24" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">66</text>
  </g>

  <!-- Game Title Badge -->
  <g transform="translate(160, 164)">
    <rect x="-95" y="-14" width="190" height="20" rx="6" fill="#020617" opacity="0.85" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="0" font-family="'Chakra Petch', 'Inter', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.1em">
      HIGHWAY <tspan fill="#fbbf24">OASIS TYCOON</tspan>
    </text>
  </g>
</svg>
