<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nokiaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070b12"/>
      <stop offset="50%" style="stop-color:#0d131f"/>
      <stop offset="100%" style="stop-color:#070a10"/>
    </linearGradient>

    <linearGradient id="lcdBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b4836"/>
      <stop offset="100%" style="stop-color:#20281d"/>
    </linearGradient>

    <linearGradient id="lcdScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9da88b"/>
      <stop offset="100%" style="stop-color:#8e997d"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="pixelGrid" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect x="0" y="0" width="3.4" height="3.4" fill="rgba(30,39,26,0.06)"/>
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="180" fill="url(#nokiaBg)"/>
  <rect x="6" y="6" width="308" height="168" rx="10" fill="none" stroke="rgba(74, 222, 128, 0.25)" stroke-width="1.2"/>

  <!-- Subtle Cyber Grid Background -->
  <line x1="10" y1="90" x2="310" y2="90" stroke="rgba(74,222,128,0.06)" stroke-width="1"/>
  <line x1="160" y1="10" x2="160" y2="170" stroke="rgba(74,222,128,0.06)" stroke-width="1"/>

  <!-- Vintage Handheld LCD Bezel -->
  <rect x="42" y="16" width="236" height="124" rx="8" fill="url(#lcdBezel)" stroke="#1a2217" stroke-width="2.5" filter="drop-shadow(0 6px 14px rgba(0,0,0,0.6))"/>

  <!-- Screen Frame Groove -->
  <rect x="48" y="22" width="224" height="112" rx="4" fill="#151b12"/>

  <!-- Retro Dot-Matrix LCD Screen -->
  <rect x="52" y="26" width="216" height="104" rx="2" fill="url(#lcdScreen)"/>
  <rect x="52" y="26" width="216" height="104" rx="2" fill="url(#pixelGrid)"/>

  <!-- LCD HUD / Top Bar -->
  <text x="58" y="38" font-family="'Courier New', monospace" font-size="9" font-weight="900" fill="#1c2518">NOKIA 3310</text>
  <text x="210" y="38" font-family="'Courier New', monospace" font-size="9" font-weight="900" fill="#1c2518">SC:0480</text>
  <line x1="56" y1="41" x2="264" y2="41" stroke="#253020" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- Snake Body on LCD (Authentic 8x8 pixel blocks) -->
  <!-- Snake Segments -->
  <g fill="#1a2316">
    <!-- Tail -->
    <rect x="76" y="86" width="9" height="9" rx="1"/>
    <rect x="87" y="86" width="9" height="9" rx="1"/>
    <rect x="98" y="86" width="9" height="9" rx="1"/>
    <rect x="109" y="86" width="9" height="9" rx="1"/>
    <rect x="120" y="86" width="9" height="9" rx="1"/>
    <!-- Turn Up -->
    <rect x="120" y="75" width="9" height="9" rx="1"/>
    <rect x="120" y="64" width="9" height="9" rx="1"/>
    <!-- Turn Right -->
    <rect x="131" y="64" width="9" height="9" rx="1"/>
    <rect x="142" y="64" width="9" height="9" rx="1"/>
    <rect x="153" y="64" width="9" height="9" rx="1"/>
    <rect x="164" y="64" width="9" height="9" rx="1"/>
    <!-- Turn Down -->
    <rect x="164" y="75" width="9" height="9" rx="1"/>
    <rect x="164" y="86" width="9" height="9" rx="1"/>
    <rect x="164" y="97" width="9" height="9" rx="1"/>
    <!-- Turn Right again towards food -->
    <rect x="175" y="97" width="9" height="9" rx="1"/>
    <rect x="186" y="97" width="9" height="9" rx="1"/>
    <rect x="197" y="97" width="9" height="9" rx="1"/>
    <!-- Head -->
    <rect x="208" y="97" width="10" height="10" rx="1.5"/>
    <!-- Eye (inverted LCD pixel) -->
    <rect x="214" y="99" width="2" height="2" fill="#9da88b"/>
    <rect x="214" y="103" width="2" height="2" fill="#9da88b"/>

    <!-- Food Item (Classic Pixel Bug/Apple) -->
    <rect x="238" y="99" width="6" height="6"/>
    <rect x="240" y="97" width="2" height="2"/>
    <rect x="236" y="101" width="2" height="2"/>
    <rect x="244" y="101" width="2" height="2"/>
  </g>

  <!-- Border Wall on LCD Screen -->
  <rect x="56" y="44" width="208" height="82" fill="none" stroke="#253020" stroke-width="1.8"/>

  <!-- Game Label & Tagline below bezel -->
  <text x="160" y="156" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="900" fill="#4ade80" text-anchor="middle" letter-spacing="0.12em" filter="url(#neonGlow)">NOKIA SNAKE</text>
  <text x="160" y="170" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.05em">CLASSIC • SIMPLE • ADDICTIVE</text>
</svg>
