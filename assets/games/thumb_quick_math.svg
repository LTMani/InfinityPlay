<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#141b34"/>
      <stop offset="50%" stop-color="#090d1a"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="neonCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2640" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f1424" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3556"/>
      <stop offset="100%" stop-color="#141c30"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="500" fill="url(#bgGlow)"/>

  <!-- Perspective Grid -->
  <g opacity="0.12" stroke="#00f0ff" stroke-width="1">
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="370" x2="800" y2="370"/>
    <line x1="0" y1="430" x2="800" y2="430"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="400" y1="240" x2="0" y2="500"/>
    <line x1="400" y1="240" x2="160" y2="500"/>
    <line x1="400" y1="240" x2="320" y2="500"/>
    <line x1="400" y1="240" x2="480" y2="500"/>
    <line x1="400" y1="240" x2="640" y2="500"/>
    <line x1="400" y1="240" x2="800" y2="500"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="140" r="160" fill="#3b82f6" opacity="0.08" filter="blur(40px)"/>
  <circle cx="620" cy="220" r="180" fill="#00f0ff" opacity="0.07" filter="blur(45px)"/>
  <circle cx="400" cy="280" r="120" fill="#a855f7" opacity="0.06" filter="blur(35px)"/>

  <!-- Floating Mathematical Symbols in Background -->
  <g opacity="0.15" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#94a3b8">
    <text x="70" y="90">∑</text>
    <text x="720" y="110">∞</text>
    <text x="110" y="240">π</text>
    <text x="700" y="280">√x</text>
    <text x="80" y="380">÷</text>
    <text x="730" y="420">×</text>
    <text x="240" y="70">∫</text>
    <text x="560" y="80">≠</text>
  </g>

  <!-- Central Question Arena Tablet -->
  <g filter="url(#cardShadow)">
    <!-- Main Device Chassis -->
    <rect x="180" y="80" width="440" height="270" rx="20" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35"/>
    
    <!-- Top Glass Specular Line -->
    <line x1="205" y1="81" x2="595" y2="81" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- Screen Bezel Header -->
    <rect x="200" y="100" width="400" height="34" rx="8" fill="#0b0f1d" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
    <circle cx="218" cy="117" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="234" cy="117" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="250" cy="117" r="5" fill="#10b981" opacity="0.8"/>

    <text x="400" y="122" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="3">INFINITY CHALLENGE</text>

    <!-- Formula / Equation Main Screen -->
    <rect x="200" y="144" width="400" height="85" rx="12" fill="#070a14" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.45"/>
    <text x="400" y="198" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#glowCyan)">48 + 27 = ?</text>

    <!-- Timer Gauge Bar -->
    <rect x="200" y="235" width="400" height="6" rx="3" fill="#1e293b"/>
    <rect x="200" y="235" width="290" height="6" rx="3" fill="url(#neonCyanGrad)"/>

    <!-- 4 Tactile Answer Buttons -->
    <g transform="translate(200, 252)">
      <!-- Button 1 -->
      <g>
        <rect x="0" y="0" width="92" height="42" rx="8" fill="url(#btnGrad)" stroke="#475569" stroke-width="1"/>
        <text x="46" y="26" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle">65</text>
      </g>
      <!-- Button 2 (Selected Correct) -->
      <g transform="translate(102, 0)">
        <rect x="0" y="0" width="92" height="42" rx="8" fill="#065f46" stroke="#10b981" stroke-width="2"/>
        <text x="46" y="26" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#34d399" text-anchor="middle">75</text>
      </g>
      <!-- Button 3 -->
      <g transform="translate(204, 0)">
        <rect x="0" y="0" width="92" height="42" rx="8" fill="url(#btnGrad)" stroke="#475569" stroke-width="1"/>
        <text x="46" y="26" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle">85</text>
      </g>
      <!-- Button 4 -->
      <g transform="translate(306, 0)">
        <rect x="0" y="0" width="94" height="42" rx="8" fill="url(#btnGrad)" stroke="#475569" stroke-width="1"/>
        <text x="47" y="26" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle">71</text>
      </g>
    </g>

    <!-- Speed Bonus Floating Tag -->
    <g transform="translate(480, 205)">
      <rect x="0" y="0" width="130" height="24" rx="12" fill="#052e16" stroke="#10b981" stroke-width="1.2" opacity="0.95"/>
      <text x="65" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#4ade80" text-anchor="middle" letter-spacing="0.5">⚡ SPEED BONUS +100</text>
    </g>
  </g>

  <!-- Bottom Platform Title Banner -->
  <g transform="translate(400, 420)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">QUICK MATH</text>
    <text x="0" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">INFINITY CHALLENGE</text>
  </g>

  <!-- Top Left Badges -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="90" height="26" rx="6" fill="rgba(0, 240, 255, 0.12)" stroke="#00f0ff" stroke-width="1"/>
    <text x="45" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#00f0ff" text-anchor="middle" letter-spacing="1">PUZZLE</text>
  </g>
  <g transform="translate(130, 30)">
    <rect x="0" y="0" width="85" height="26" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1"/>
    <text x="42" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#f59e0b" text-anchor="middle" letter-spacing="1">NEW</text>
  </g>

  <!-- Top Right Rating -->
  <g transform="translate(710, 30)">
    <rect x="-40" y="0" width="85" height="26" rx="13" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="-15" y="17" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#f59e0b">★</text>
    <text x="12" y="17" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff">5.0</text>
  </g>
</svg>

