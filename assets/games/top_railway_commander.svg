<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="topSkyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#075985" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="heroGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="heroRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#topSkyGrad)" />

  <!-- Overhead 25kV Catenary Wires &amp; Masts -->
  <line x1="0" y1="80" x2="800" y2="80" stroke="#64748b" stroke-width="1.5" />
  <line x1="0" y1="120" x2="800" y2="120" stroke="#475569" stroke-width="1" />
  <line x1="160" y1="80" x2="160" y2="350" stroke="#334155" stroke-width="4" />
  <line x1="140" y1="80" x2="180" y2="80" stroke="#475569" stroke-width="5" />

  <!-- Platform Canopy on Right Side -->
  <polygon points="460,90 800,30 800,240 500,240" fill="#1e3a8a" opacity="0.85" />
  <line x1="480" y1="120" x2="800" y2="60" stroke="#3b82f6" stroke-width="3" />
  <rect x="560" y="95" width="60" height="5" rx="2" fill="#ffffff" filter="url(#softGlow)" />
  <rect x="700" y="65" width="60" height="5" rx="2" fill="#ffffff" filter="url(#softGlow)" />

  <!-- Platform Deck &amp; Edge -->
  <polygon points="480,230 800,190 800,370 490,370" fill="#f8fafc" />
  <polygon points="470,232 480,230 490,370 478,370" fill="#b91c1c" />
  <line x1="495" y1="230" x2="520" y2="370" stroke="#facc15" stroke-width="5" />

  <!-- Trilingual Signboard -->
  <g transform="translate(560, 140)">
    <line x1="30" y1="46" x2="30" y2="95" stroke="#1e293b" stroke-width="4" />
    <line x1="140" y1="46" x2="140" y2="95" stroke="#1e293b" stroke-width="4" />
    <rect x="0" y="0" width="170" height="48" rx="5" fill="#facc15" stroke="#0f172a" stroke-width="2" />
    <text x="85" y="15" fill="#000000" font-family="'Inter', sans-serif" font-weight="900" font-size="10" text-anchor="middle">அரக்கோணம்</text>
    <text x="85" y="30" fill="#000000" font-family="'Inter', sans-serif" font-weight="900" font-size="13" text-anchor="middle" letter-spacing="1">ARAKKONAM</text>
    <text x="85" y="43" fill="#000000" font-family="'Inter', sans-serif" font-weight="900" font-size="10" text-anchor="middle">अरक्कोणम</text>
  </g>

  <!-- Track Ballast &amp; Sleepers -->
  <polygon points="200,230 470,230 540,450 40,450" fill="#1e293b" />
  <line x1="220" y1="260" x2="450" y2="260" stroke="#334155" stroke-width="5" />
  <line x1="180" y1="305" x2="465" y2="305" stroke="#334155" stroke-width="7" />
  <line x1="130" y1="360" x2="485" y2="360" stroke="#334155" stroke-width="9" />
  <line x1="70" y1="425" x2="515" y2="425" stroke="#334155" stroke-width="12" />

  <!-- Converging Neon Rails -->
  <line x1="260" y1="230" x2="130" y2="450" stroke="#00f0ff" stroke-width="5" filter="url(#heroGlow)" />
  <line x1="410" y1="230" x2="445" y2="450" stroke="#00f0ff" stroke-width="5" filter="url(#heroGlow)" />

  <!-- Volumetric Headlight Stream -->
  <polygon points="325,165 80,450 450,450" fill="url(#topSkyGrad)" opacity="0.35" />

  <!-- WAP-7 Rajdhani Approaching -->
  <!-- Trailing LHB Coaches -->
  <polygon points="260,185 285,165 315,165 290,185" fill="#b91c1c" />
  <rect x="260" y="175" width="30" height="3" fill="#fef08a" />

  <!-- Pantograph with Electric Voltage Sparks -->
  <path d="M315,135 L330,100 L345,135 M310,100 L350,100" stroke="#dc2626" stroke-width="3" fill="none" />
  <circle cx="330" cy="100" r="4" fill="#ffffff" filter="url(#heroGlow)" />

  <!-- WAP-7 Locomotive Body -->
  <polygon points="275,155 375,155 395,250 255,250" fill="url(#heroRed)" />
  <!-- Dual Windshields -->
  <polygon points="282,162 322,162 320,198 276,198" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <polygon points="330,162 370,162 376,198 332,198" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <rect x="282" y="162" width="40" height="5" fill="#065f46" />
  <rect x="330" y="162" width="40" height="5" fill="#065f46" />

  <!-- Lower Body -->
  <polygon points="255,250 395,250 402,315 248,315" fill="#991b1b" />
  <!-- Golden Chevron Cheatline -->
  <polygon points="250,256 325,286 400,256 396,268 325,298 254,268" fill="url(#heroGold)" filter="url(#heroGlow)" />

  <!-- Tiranga Flag on Nose -->
  <g transform="translate(307, 246)">
    <rect x="0" y="0" width="36" height="5" fill="#ff9933" />
    <rect x="0" y="5" width="36" height="5" fill="#ffffff" />
    <rect x="0" y="10" width="36" height="5" fill="#138808" />
    <circle cx="18" cy="7.5" r="2.2" fill="#000080" />
  </g>
  <text x="325" y="240" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="9" text-anchor="middle">RAJDHANI • WAP-7 30201</text>

  <!-- Headlights -->
  <circle cx="325" cy="145" r="8" fill="#ffffff" filter="url(#heroGlow)" />
  <circle cx="270" cy="275" r="6" fill="#ffffff" filter="url(#heroGlow)" />
  <circle cx="380" cy="275" r="6" fill="#ffffff" filter="url(#heroGlow)" />

  <!-- Red Cowcatcher with White Hazard Stripes -->
  <polygon points="255,315 395,315 380,350 270,350" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2" />
  <line x1="285" y1="317" x2="280" y2="348" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <line x1="305" y1="317" x2="302" y2="348" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <line x1="325" y1="317" x2="325" y2="348" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <line x1="345" y1="317" x2="348" y2="348" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <line x1="365" y1="317" x2="370" y2="348" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <!-- Center Knuckle Coupler -->
  <rect x="315" y="335" width="20" height="20" rx="3" fill="#1e293b" />

  <!-- Glowing Title Overlay Across Top Center -->
  <g transform="translate(400, 55)">
    <rect x="-240" y="-35" width="480" height="60" rx="16" fill="rgba(15, 23, 42, 0.92)" stroke="url(#heroGold)" stroke-width="2" filter="url(#heroGlow)" />
    <text x="0" y="-4" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="22" letter-spacing="1">RAILWAY COMMANDER</text>
    <text x="0" y="16" text-anchor="middle" fill="#00f0ff" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="3">INDIAN RAILWAYS WAP-7 2.5D SIMULATOR</text>
  </g>
</svg>