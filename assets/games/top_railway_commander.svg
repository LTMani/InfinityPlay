<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="topSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="speedNeon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glowBanner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#topSky)" />

  <!-- High-speed track perspective -->
  <polygon points="360,200 440,200 680,450 120,450" fill="#0f172a" />
  <line x1="385" y1="200" x2="220" y2="450" stroke="#00f0ff" stroke-width="6" filter="url(#glowBanner)" />
  <line x1="415" y1="200" x2="580" y2="450" stroke="#00f0ff" stroke-width="6" filter="url(#glowBanner)" />

  <!-- Modern Bullet Train Silhouette -->
  <path d="M 370 210 L 400 130 L 430 210 L 460 330 L 340 330 Z" fill="url(#speedNeon)" filter="url(#glowBanner)" opacity="0.9" />
  <polygon points="380,185 400,145 420,185" fill="#082f49" />
  <circle cx="375" cy="290" r="10" fill="#ffffff" filter="url(#glowBanner)" />
  <circle cx="425" cy="290" r="10" fill="#ffffff" filter="url(#glowBanner)" />

  <!-- Signals along track -->
  <rect x="280" y="160" width="18" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <circle cx="289" cy="190" r="5" fill="#22c55e" filter="url(#glowBanner)" />

  <!-- Platform structure -->
  <polygon points="450,230 520,230 760,450 630,450" fill="#1e293b" stroke="#f59e0b" stroke-width="3" />

  <!-- Glowing Title Overlay -->
  <text x="400" y="70" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="34" letter-spacing="1">RAILWAY COMMANDER</text>
  <text x="400" y="100" text-anchor="middle" fill="#00f0ff" font-family="'Inter', sans-serif" font-weight="700" font-size="16" letter-spacing="3">DRIVE • SIGNAL • STOP • DELIVER</text>
</svg>
