<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="locoGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="lightBeam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky & Stars -->
  <rect width="600" height="400" fill="url(#skyGrad)" />
  <circle cx="500" cy="80" r="30" fill="#fef08a" filter="url(#neonGlow)" />

  <!-- Ballast & Rails in Perspective -->
  <polygon points="260,180 340,180 520,400 80,400" fill="#1e293b" />
  
  <!-- Sleepers -->
  <line x1="250" y1="210" x2="350" y2="210" stroke="#334155" stroke-width="4" />
  <line x1="230" y1="240" x2="370" y2="240" stroke="#334155" stroke-width="6" />
  <line x1="200" y1="280" x2="400" y2="280" stroke="#334155" stroke-width="8" />
  <line x1="160" y1="330" x2="440" y2="330" stroke="#334155" stroke-width="11" />
  <line x1="100" y1="390" x2="500" y2="390" stroke="#334155" stroke-width="14" />

  <!-- Shiny Steel Rails -->
  <line x1="280" y1="180" x2="160" y2="400" stroke="#00f0ff" stroke-width="5" filter="url(#neonGlow)" />
  <line x1="320" y1="180" x2="440" y2="400" stroke="#00f0ff" stroke-width="5" filter="url(#neonGlow)" />

  <!-- Headlight beam -->
  <polygon points="285,155 315,155 460,370 140,370" fill="url(#lightBeam)" opacity="0.45" />

  <!-- Modern Locomotive Nose (Approaching) -->
  <path d="M 270 195 L 300 130 L 330 195 L 345 270 L 255 270 Z" fill="url(#locoGrad)" />
  <polygon points="280,180 300,140 320,180 315,200 285,200" fill="#0c4a6e" stroke="#00f0ff" stroke-width="2" />
  
  <!-- Front Headlights -->
  <circle cx="280" cy="245" r="8" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="320" cy="245" r="8" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="300" cy="142" r="6" fill="#ffffff" filter="url(#neonGlow)" />

  <!-- Railway Signal Mast (Green Light) -->
  <line x1="200" y1="140" x2="200" y2="250" stroke="#475569" stroke-width="4" />
  <rect x="190" y="140" width="20" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <circle cx="200" cy="152" r="5" fill="#334155" />
  <circle cx="200" cy="165" r="5" fill="#334155" />
  <circle cx="200" cy="178" r="6" fill="#22c55e" filter="url(#neonGlow)" />

  <!-- Game Title Badge -->
  <rect x="30" y="25" width="250" height="46" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#00f0ff" stroke-width="1.5" />
  <text x="45" y="46" fill="#00f0ff" font-family="'Inter', sans-serif" font-weight="900" font-size="16">RAILWAY COMMANDER</text>
  <text x="45" y="62" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="600" font-size="10">2.5D TRAIN DRIVING SIMULATOR</text>
</svg>
