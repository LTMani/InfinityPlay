<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080a14"/>
      <stop offset="50%" style="stop-color:#0a1220"/>
      <stop offset="100%" style="stop-color:#0f141e"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff2d55"/>
      <stop offset="30%" style="stop-color:#00f0ff"/>
      <stop offset="60%" style="stop-color:#d946ef"/>
      <stop offset="100%" style="stop-color:#00ff88"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bgGrad)"/>
  <rect x="40" y="40" width="560" height="280" rx="16" fill="rgba(15,20,30,0.8)" stroke="rgba(0,240,255,0.1)" stroke-width="1"/>
  <path d="M80 180 L260 180" stroke="url(#laserGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="260,174 276,180 260,186" fill="#ff2d55" filter="url(#glow)"/>
  <g transform="rotate(45 300 180)">
    <polygon points="288,170 312,180 288,190" fill="#ffffff" opacity="0.9"/>
    <polygon points="290,172 310,180 290,188" fill="rgba(255,255,255,0.3)"/>
  </g>
  <polygon points="330,150 350,180 330,210" fill="#d946ef" opacity="0.9" filter="url(#softGlow)"/>
  <polygon points="332,156 346,180 332,204" fill="#f5a6ff" opacity="0.5"/>
  <g transform="rotate(-45 380 180)">
    <polygon points="368,170 392,180 368,190" fill="#ffffff" opacity="0.8"/>
  </g>
  <circle cx="520" cy="180" r="20" fill="#00ff88" filter="url(#glow)"/>
  <circle cx="520" cy="180" r="12" fill="#080a14"/>
  <circle cx="520" cy="180" r="6" fill="#ffffff"/>
  <text x="320" y="305" font-family="Inter, sans-serif" font-size="24" font-weight="900" fill="url(#laserGrad)" text-anchor="middle" letter-spacing="0.08em" filter="url(#softGlow)">LASER LOGIC</text>
  <text x="320" y="330" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6b7b94" text-anchor="middle" letter-spacing="0.1em">DIRECT THE BEAM • SOLVE THE PUZZLE</text>
</svg>