<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="topNokiaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070b14"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#05080e"/>
    </linearGradient>

    <linearGradient id="phoneCasing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>

    <linearGradient id="topLcdBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#374332"/>
      <stop offset="100%" style="stop-color:#1d2419"/>
    </linearGradient>

    <linearGradient id="topLcdScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9da88b"/>
      <stop offset="50%" style="stop-color:#94a081"/>
      <stop offset="100%" style="stop-color:#879374"/>
    </linearGradient>

    <pattern id="topPixelGrid" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none"/>
      <rect x="0" y="0" width="5.2" height="5.2" fill="rgba(25, 33, 21, 0.07)"/>
    </pattern>

    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" style="stop-color:rgba(0,0,0,0)"/>
      <stop offset="100%" style="stop-color:rgba(0,0,0,0.5)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#topNokiaBg)"/>
  
  <!-- Cyber / Retro Grid Lines -->
  <g stroke="rgba(74,222,128,0.06)" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
  </g>

  <!-- Left Side: Phone Shell Artwork -->
  <!-- Vintage Phone Silhouette Shadow & Frame -->
  <rect x="50" y="24" width="310" height="312" rx="28" fill="url(#phoneCasing)" stroke="rgba(255,255,255,0.12)" stroke-width="2" filter="drop-shadow(0 14px 28px rgba(0,0,0,0.8))"/>

  <!-- Phone Speaker Ear Grill -->
  <rect x="180" y="38" width="50" height="6" rx="3" fill="#0b0f19"/>

  <!-- Handheld LCD Bezel -->
  <rect x="74" y="56" width="262" height="194" rx="10" fill="url(#topLcdBezel)" stroke="#161d13" stroke-width="3"/>
  <rect x="80" y="62" width="250" height="182" rx="6" fill="#12180f"/>

  <!-- Dot-Matrix Green LCD Screen -->
  <rect x="84" y="66" width="242" height="174" rx="4" fill="url(#topLcdScreen)"/>
  <rect x="84" y="66" width="242" height="174" rx="4" fill="url(#topPixelGrid)"/>
  <rect x="84" y="66" width="242" height="174" rx="4" fill="url(#vignette)"/>

  <!-- LCD Screen Top HUD -->
  <g fill="#1a2316" font-family="'Courier New', monospace" font-size="10" font-weight="900">
    <text x="94" y="82">📶 ■■■■</text>
    <text x="160" y="82">NOKIA SNAKE</text>
    <text x="274" y="82">🔋 ■■■</text>
    <line x1="90" y1="87" x2="320" y2="87" stroke="#253020" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Outer Boundary Wall on LCD Screen -->
  <rect x="92" y="92" width="226" height="138" fill="none" stroke="#222c1d" stroke-width="2.5"/>

  <!-- Pixelated Snake on LCD -->
  <g fill="#172014">
    <!-- Tail -->
    <rect x="110" y="196" width="12" height="12" rx="1.5"/>
    <rect x="124" y="196" width="12" height="12" rx="1.5"/>
    <rect x="138" y="196" width="12" height="12" rx="1.5"/>
    <rect x="152" y="196" width="12" height="12" rx="1.5"/>
    <!-- Upward loop -->
    <rect x="152" y="182" width="12" height="12" rx="1.5"/>
    <rect x="152" y="168" width="12" height="12" rx="1.5"/>
    <rect x="152" y="154" width="12" height="12" rx="1.5"/>
    <!-- Rightward loop -->
    <rect x="166" y="154" width="12" height="12" rx="1.5"/>
    <rect x="180" y="154" width="12" height="12" rx="1.5"/>
    <rect x="194" y="154" width="12" height="12" rx="1.5"/>
    <!-- Downward turn -->
    <rect x="194" y="168" width="12" height="12" rx="1.5"/>
    <rect x="194" y="182" width="12" height="12" rx="1.5"/>
    <rect x="208" y="182" width="12" height="12" rx="1.5"/>
    <rect x="222" y="182" width="12" height="12" rx="1.5"/>
    <!-- Head -->
    <rect x="236" y="182" width="14" height="14" rx="2.5"/>
    <!-- Head Eyes -->
    <rect x="244" y="185" width="3" height="3" fill="#9da88b"/>
    <rect x="244" y="191" width="3" height="3" fill="#9da88b"/>

    <!-- Food Item -->
    <rect x="282" y="185" width="8" height="8"/>
    <rect x="285" y="182" width="2" height="3"/>
    <rect x="280" y="188" width="2" height="2"/>
    <rect x="290" y="188" width="2" height="2"/>
  </g>

  <!-- Keypad buttons mockup on phone -->
  <g fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <rect x="175" y="260" width="60" height="22" rx="11"/>
    <circle cx="120" cy="271" r="14"/>
    <circle cx="290" cy="271" r="14"/>
    <circle cx="205" cy="305" r="12"/>
  </g>

  <!-- Right Side: Prominent Hero Typography & Feature Badges -->
  <g transform="translate(385, 45)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="26" rx="13" fill="rgba(74, 222, 128, 0.15)" stroke="rgba(74, 222, 128, 0.4)" stroke-width="1.2"/>
    <text x="65" y="17" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" fill="#4ade80" text-anchor="middle" letter-spacing="0.08em">⚡ RETRO ARCADE</text>

    <!-- Main Title -->
    <text x="0" y="65" font-family="'Inter', system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="0.04em">NOKIA SNAKE</text>
    <line x1="0" y1="78" x2="225" y2="78" stroke="#4ade80" stroke-width="3" filter="url(#greenGlow)"/>

    <!-- Tagline -->
    <text x="0" y="104" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#86efac" letter-spacing="0.04em">"Classic. Simple. Addictive."</text>

    <!-- Description -->
    <text x="0" y="132" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" width="220">
      <tspan x="0" dy="0">Relive the iconic mobile experience.</tspan>
      <tspan x="0" dy="18">Eat food, grow your tail, beat high</tspan>
      <tspan x="0" dy="18">scores, and master the 20x20 grid.</tspan>
    </text>

    <!-- Mini Feature Highlights -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="105" height="42" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="12" y="18" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748b">BOARD</text>
      <text x="12" y="34" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">20 × 20</text>

      <rect x="115" y="0" width="115" height="42" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="127" y="18" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748b">AUDIO</text>
      <text x="127" y="34" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="800" fill="#4ade80">8-BIT PIEZO</text>
    </g>

    <g transform="translate(0, 248)">
      <text x="0" y="16" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">🎮 Arrow Keys • WASD • Swipe • D-Pad</text>
    </g>
  </g>
</svg>
