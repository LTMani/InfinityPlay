    <!-- Category Pill -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="rgba(245, 158, 11, 0.18)" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="65" y="18" fill="#fbbf24" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="2" text-anchor="middle">STRATEGY</text>

    <!-- Sub Badge -->
    <rect x="140" y="0" width="150" height="28" rx="14" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="1.2"/>
    <text x="215" y="18" fill="#00f0ff" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.5" text-anchor="middle">LOGIC PUZZLE</text>

    <!-- Main Title -->
    <text x="0" y="72" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="44" letter-spacing="4" filter="url(#glowCyan)">PSEUDOKO</text>

    <!-- Tagline -->
