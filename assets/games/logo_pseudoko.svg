  <!-- Central Ambient Aura -->
  <circle cx="280" cy="220" r="140" fill="#a855f7" opacity="0.18" filter="url(#glowPurple)"/>
  <circle cx="280" cy="220" r="80" fill="#00f0ff" opacity="0.15" filter="url(#glowCyan)"/>

  <!-- Stylized Cybernetic Emblem: Letter 'P' with Grid Topology -->
  <g transform="translate(160, 90)">
    <!-- Shadow / Base -->
    <path d="M40 20 L160 20 C220 20 250 55 250 110 C250 165 220 200 160 200 L110 200 L110 290 L40 290 Z" fill="rgba(6, 9, 19, 0.9)" stroke="#1e293b" stroke-width="12" rx="10"/>

    <!-- Outer Glow Border -->
    <path d="M40 20 L160 20 C220 20 250 55 250 110 C250 165 220 200 160 200 L110 200 L110 290 L40 290 Z" fill="none" stroke="url(#pGrad)" stroke-width="8" filter="url(#glowPurple)"/>

    <!-- Core Fill -->
    <path d="M40 20 L160 20 C220 20 250 55 250 110 C250 165 220 200 160 200 L110 200 L110 290 L40 290 Z" fill="#0c1224"/>

    <!-- Inner 'P' Cutout (Counter) -->
    <rect x="100" y="70" width="75" height="75" rx="14" fill="#060913" stroke="#00f0ff" stroke-width="3.5" filter="url(#glowCyan)"/>
    
    <!-- Inner Tactical Core Node in Cutout -->
    <circle cx="137.5" cy="107.5" r="14" fill="url(#pGrad)"/>
    <circle cx="137.5" cy="107.5" r="6" fill="#ffffff"/>

    <!-- Futuristic Grid Matrix inside the Letter P stem -->
    <g opacity="0.8">
      <rect x="52" y="32" width="45" height="45" rx="6" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="1"/>
      <text x="74" y="60" fill="#00f0ff" font-family="'Inter', sans-serif" font-weight="900" font-size="18" text-anchor="middle">α</text>

      <rect x="52" y="85" width="45" height="45" rx="6" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1"/>
      <text x="74" y="113" fill="#a855f7" font-family="'Inter', sans-serif" font-weight="900" font-size="18" text-anchor="middle">β</text>

      <rect x="52" y="138" width="45" height="45" rx="6" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="1"/>
      <text x="74" y="166" fill="#3b82f6" font-family="'Inter', sans-serif" font-weight="900" font-size="18" text-anchor="middle">γ</text>

      <rect x="52" y="191" width="45" height="45" rx="6" fill="rgba(236, 72, 153, 0.15)" stroke="#ec4899" stroke-width="1"/>
      <text x="74" y="219" fill="#ec4899" font-family="'Inter', sans-serif" font-weight="900" font-size="18" text-anchor="middle">δ</text>

      <rect x="52" y="244" width="45" height="38" rx="6" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1"/>
      <text x="74" y="270" fill="#f59e0b" font-family="'Inter', sans-serif" font-weight="900" font-size="16" text-anchor="middle">⚡</text>
    </g>

    <!-- Circuit Lines Crossing P -->
    <path d="M110 160 L185 160 L210 185" stroke="#00f0ff" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
    <circle cx="210" cy="185" r="3.5" fill="#00f0ff"/>

    <path d="M175 60 L220 60 L240 80" stroke="#a855f7" stroke-width="2" fill="none"/>
    <circle cx="240" cy="80" r="3.5" fill="#a855f7"/>
