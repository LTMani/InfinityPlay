<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#141a33"/>
      <stop offset="50%" stop-color="#090d1c"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>

    <!-- Neon Glows -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="80%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="800" height="500" fill="url(#bgGlow)"/>

  <!-- Perspective Floor Grid (Tactical Matrix) -->
  <g opacity="0.35">
    <path d="M0 450 L800 450 M0 400 L800 400 M0 360 L800 360 M0 330 L800 330 M0 310 L800 310 M0 295 L800 295" stroke="#3b82f6" stroke-width="1.2"/>
    <path d="M400 280 L50 500 M400 280 L150 500 M400 280 L280 500 M400 280 L400 500 M400 280 L520 500 M400 280 L650 500 M400 280 L750 500" stroke="#8b5cf6" stroke-width="1.2"/>
  </g>

  <!-- Cyber Circuit Traces & Conduits -->
  <g opacity="0.5" stroke="#00f0ff" stroke-width="1.5" fill="none">
    <path d="M80 80 L180 80 L240 140 L320 140" stroke-dasharray="4,4"/>
    <circle cx="80" cy="80" r="4" fill="#00f0ff"/>
    <circle cx="320" cy="140" r="3" fill="#00f0ff"/>

    <path d="M720 80 L620 80 L560 140 L480 140" stroke-dasharray="4,4"/>
    <circle cx="720" cy="80" r="4" fill="#00f0ff"/>
    <circle cx="480" cy="140" r="3" fill="#00f0ff"/>

    <path d="M120 400 L200 400 L250 350" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="120" cy="400" r="3.5" fill="#a855f7"/>

    <path d="M680 400 L600 400 L550 350" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="680" cy="400" r="3.5" fill="#a855f7"/>
  </g>

  <!-- 8x8 Tactical Puzzle Grid (Right / Center Backdrop) -->
