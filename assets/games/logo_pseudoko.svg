h="21" height="21" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/><rect x="10" y="110" width="21" height="21" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/><rect x="35" y="110" width="21" height="21" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/><rect x="60" y="110" width="21" height="21" rx="3" fill="#a855f7" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/><rect x="85" y="110" width="21" height="21" rx="3" fill="#00f0ff" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/><circle cx="95.5" cy="120.5" r="4" fill="#ffffff" filter="url(#glowCyan)"/><rect x="110" y="110" width="21" height="21" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/><rect x="135" y="110" width="21" height="21" rx="3" fill="#a855f7" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/><rect x="160" y="110" width="21" height="21" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/><rect x="185" y="110" width="21" height="21" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/><rect x="10" y="135" width="21" height="21" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/><rect x="35" y="135" width="21" height="21" rx="3" fill="#a855f7" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/><rect x="60" y="135" width="21" height="21" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/><rect x="85" y="135" width="21" height="21" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/><rect x="110" y="135" width="21" height="21" rx="3" fill="#a855f7" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/><rect x="135" y="135" width="21" height="21" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/><rect x="160" y="135" width="21" height