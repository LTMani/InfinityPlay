<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#181938"/>
      <stop offset="45%" stop-color="#0c0e1e"/>
      <stop offset="100%" stop-color="#04050a"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Gradients for Tiles -->
    <linearGradient id="grad2048" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="grad1024" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="grad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <linearGradient id="grad256" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="grad128" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <linearGradient id="grad64" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="gradTitle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="url(#bgGlow)"/>

  <!-- Matrix Grid Accent Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.2">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
  </g>

  <!-- Glowing Aura behind central tiles -->
  <circle cx="560" cy="250" r="180" fill="#fbbf24" opacity="0.12" filter="url(#glowGold)"/>
  <circle cx="280" cy="200" r="160" fill="#a855f7" opacity="0.1" filter="url(#glowCyan)"/>

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(60, 130)">
    <!-- Badges -->
    <rect x="0" y="0" width="80" height="26" rx="13" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="1.2"/>
    <text x="40" y="17" fill="#00f0ff" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">PUZZLE</text>

    <rect x="90" y="0" width="120" height="26" rx="13" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="150" y="17" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">TARGET 2048</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="url(#gradTitle)" font-family="'Inter', -apple-system, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">BLOCK</text>
    <text x="0" y="145" fill="url(#gradTitle)" font-family="'Inter', -apple-system, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">MERGE</text>

    <!-- Subtitle -->
    <text x="0" y="190" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="16" font-weight="500" letter-spacing="0.5">Merge numbers. Reach infinity.</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 225)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="700">⚡ Fast-Paced</text>

      <rect x="142" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="156" y="22" fill="#a855f7" font-family="'Inter', sans-serif" font-size="12" font-weight="700">↩ 1-Step Undo</text>
    </g>
  </g>

  <!-- Right Side: Isometric & Dynamic Floating Blocks Representation -->
  <g transform="translate(420, 50)">
    <!-- 4x4 Mini Board Base Plate -->
    <rect x="30" y="30" width="310" height="310" rx="24" fill="#0e1324" stroke="rgba(255,255,255,0.12)" stroke-width="2" filter="url(#tileShadow)"/>

    <!-- Grid Slots Backing -->
    <g opacity="0.6">
      <rect x="46" y="46" width="60" height="60" rx="10" fill="#171e36"/>
      <rect x="118" y="46" width="60" height="60" rx="10" fill="#171e36"/>
      <rect x="190" y="46" width="60" height="60" rx="10" fill="#171e36"/>
      <rect x="262" y="46" width="60" height="60" rx="10" fill="#171e36"/>

      <rect x="46" y="118" width="60" height="60" rx="10" fill="#171e36"/>
      <rect x="118" y="118" width="60" height="60" rx="10" fill="#171e36"/>
      <rect x="190" y="118" width="60" height="60" rx="10" fill="#171e36"/>
      <rect x="262" y="118" width="60" height="60" rx="10" fill="#171e36"/>

      <rect x="46" y="190" width="60" height="60" rx="10" fill="#171e36"/>
      <rect x="118" y="190" width="60" height="60" rx="10" fill="#171e36"/>
      <rect x="190" y="190" width="60" height="60" rx="10" fill="#171e36"/>
      <rect x="262" y="190" width="60" height="60" rx="10" fill="#171e36"/>

      <rect x="46" y="262" width="60" height="60" rx="10" fill="#171e36"/>
      <rect x="118" y="262" width="60" height="60" rx="10" fill="#171e36"/>
      <rect x="190" y="262" width="60" height="60" rx="10" fill="#171e36"/>
      <rect x="262" y="262" width="60" height="60" rx="10" fill="#171e36"/>
    </g>

    <!-- Actual Colored Tiles on Board -->
    <!-- Tile 4 -->
    <rect x="46" y="46" width="60" height="60" rx="10" fill="#0e7490" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="76" y="85" fill="#ecfeff" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="800" text-anchor="middle">4</text>

    <!-- Tile 16 -->
    <rect x="118" y="46" width="60" height="60" rx="10" fill="#4f46e5" stroke="#818cf8" stroke-width="1.5"/>
    <text x="148" y="84" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800" text-anchor="middle">16</text>

    <!-- Tile 64 -->
    <rect x="190" y="46" width="60" height="60" rx="10" fill="url(#grad64)" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="220" y="84" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800" text-anchor="middle">64</text>

    <!-- Tile 128 -->
    <rect x="46" y="118" width="60" height="60" rx="10" fill="url(#grad128)" stroke="#f472b6" stroke-width="1.5"/>
    <text x="76" y="84" transform="translate(0, 72)" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" text-anchor="middle">128</text>

    <!-- Tile 256 -->
    <rect x="118" y="118" width="60" height="60" rx="10" fill="url(#grad256)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="148" y="84" transform="translate(0, 72)" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" text-anchor="middle">256</text>

    <!-- Tile 512 -->
    <rect x="190" y="118" width="60" height="60" rx="10" fill="url(#grad512)" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="220" y="84" transform="translate(0, 72)" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" text-anchor="middle">512</text>

    <!-- Tile 1024 -->
    <rect x="46" y="190" width="60" height="60" rx="10" fill="url(#grad1024)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="76" y="84" transform="translate(0, 144)" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" text-anchor="middle">1024</text>

    <!-- Mega Hero Tile: 2048 (Floating outward in 3D glory) -->
    <g transform="translate(136, 170)" filter="url(#glowGold)">
      <rect x="0" y="0" width="134" height="134" rx="18" fill="url(#grad2048)" stroke="#ffffff" stroke-width="3"/>
      <!-- Inner Gloss -->
      <rect x="6" y="6" width="122" height="60" rx="12" fill="#ffffff" fill-opacity="0.2"/>
      <text x="67" y="80" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="38" font-weight="900" text-anchor="middle">2048</text>
      <!-- Crown Icon on top of 2048 -->
      <path d="M48 30 L55 38 L67 26 L79 38 L86 30 L83 45 L51 45 Z" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>
