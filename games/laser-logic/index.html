<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LASER LOGIC — InfinityPlay</title>
  <meta name="description" content="Play LASER LOGIC: A laser-based puzzle game on InfinityPlay. Direct lasers through mirrors and prisms to hit targets.">

  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/laser-logic.css">
</head>
<body>

  <div class="ll-container">
    <header class="ll-header">
      <div class="ll-brand">
        <img src="assets/logo.svg" alt="Laser Logic Logo" class="ll-logo">
        <div>
          <h1 class="ll-title">LASER LOGIC</h1>
          <p class="ll-subtitle">Direct the beam. Solve the puzzle.</p>
        </div>
      </div>
      <div class="ll-controls">
        <button class="ll-btn ll-btn-primary" id="btn-new-game" title="New Game">
          <span>🔄</span> New Puzzle
        </button>
        <a href="../../index.html" class="ll-btn ll-btn-exit" id="btn-exit" title="Return to InfinityPlay Portal">
          <span>⮌</span> Exit
        </a>
      </div>
    </header>

    <main class="ll-board-wrapper" role="region" aria-label="Laser Logic Game Board">
      <canvas id="gameCanvas" class="ll-canvas"></canvas>
      <div class="ll-overlay" id="levelCompleteOverlay" hidden>
        <div class="ll-overlay-content">
          <h2>Level Complete!</h2>
          <p>Laser reached all targets.</p>
          <button class="ll-btn ll-btn-primary" id="btn-next-level">Next Level</button>
        </div>
      </div>
    </main>

    <div class="ll-info">
      <div class="ll-info-item">
        <span class="ll-info-icon">🖱️</span>
        <span>Click mirrors to rotate</span>
      </div>
      <div class="ll-info-item">
        <span class="ll-info-icon">🎯</span>
        <span>Direct laser to all targets</span>
      </div>
      <div class="ll-info-item">
        <span class="ll-info-icon">💡</span>
        <span>Use prisms to split beams</span>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
