<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spectrumRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="20%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="80%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="hexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="#0b0f19"/>
  <circle cx="128" cy="128" r="100" fill="url(#logoGlow)"/>
  
  <!-- Outer Spectrum Ring -->
  <circle cx="128" cy="128" r="84" fill="none" stroke="url(#spectrumRing)" stroke-width="8" stroke-dasharray="8 6" opacity="0.85"/>

  <!-- Inner Dark Prism Shield -->
  <polygon points="128,48 196,88 196,168 128,208 60,168 60,88" fill="#131b2e" stroke="#38bdf8" stroke-width="3" filter="url(#hexGlow)"/>

  <!-- 4 Swatch Quadrants -->
  <path d="M128,68 L176,96 L128,124 Z" fill="#ef4444" opacity="0.9"/>
  <path d="M176,104 L176,160 L128,132 Z" fill="#3b82f6" opacity="0.9"/>
  <path d="M176,164 L128,192 L128,136 Z" fill="#10b981" opacity="0.9"/>
  <path d="M124,192 L76,164 L124,136 Z" fill="#f59e0b" opacity="0.9"/>
  <path d="M76,160 L76,104 L124,132 Z" fill="#8b5cf6" opacity="0.9"/>
  <path d="M76,96 L124,68 L124,124 Z" fill="#ec4899" opacity="0.9"/>

  <!-- Center Core Crystal -->
  <circle cx="128" cy="128" r="22" fill="#0f172a" stroke="#ffffff" stroke-width="3"/>
  <text x="128" y="137" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">◈</text>
</svg>

