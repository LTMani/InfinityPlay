<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="logoBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="80%" stop-color="#1c0a02"/>
      <stop offset="100%" stop-color="#0a0300"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#logoBg)"/>
  <circle cx="128" cy="128" r="100" fill="none" stroke="url(#goldRing)" stroke-width="8"/>

  <!-- Mole Hole -->
  <ellipse cx="128" cy="175" rx="72" ry="24" fill="#0c0704" stroke="#78350f" stroke-width="4"/>

  <!-- Mole Body -->
  <g transform="translate(128, 140)">
    <path d="M-36,35 C-36,-20 -28,-45 0,-45 C28,-45 36,-20 36,35 Z" fill="#78350f"/>
    <!-- Snout & Nose -->
    <ellipse cx="0" cy="-6" rx="22" ry="14" fill="#fde68a"/>
    <ellipse cx="0" cy="-11" rx="8" ry="5" fill="#1c1917"/>
    <!-- Eyes -->
    <circle cx="-13" cy="-22" r="5.5" fill="#1c1917"/>
    <circle cx="-11" cy="-24" r="2" fill="#ffffff"/>
    <circle cx="13" cy="-22" r="5.5" fill="#1c1917"/>
    <circle cx="15" cy="-24" r="2" fill="#ffffff"/>
    <!-- Hard Hat -->
    <path d="M-28,-32 C-28,-50 -16,-58 0,-58 C16,-58 28,-50 28,-32 Z" fill="#eab308"/>
    <rect x="-33" y="-34" width="66" height="6" rx="3" fill="#ca8a04"/>
    <circle cx="0" cy="-45" r="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <!-- Paws -->
    <ellipse cx="-32" cy="26" rx="10" ry="7" fill="#fde68a"/>
    <ellipse cx="32" cy="26" rx="10" ry="7" fill="#fde68a"/>
  </g>

  <!-- Mallet Overlaid in striking angle -->
  <g transform="translate(180, 80) rotate(-25)">
    <rect x="-6" y="20" width="12" height="90" rx="5" fill="#d97706" stroke="#92400e" stroke-width="2"/>
    <rect x="-35" y="-20" width="70" height="42" rx="8" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <rect x="-35" y="-20" width="10" height="42" rx="4" fill="#f59e0b"/>
    <rect x="25" y="-20" width="10" height="42" rx="4" fill="#f59e0b"/>
    <!-- Sparkle -->
    <polygon points="-40,-5 -35,-20 -20,-15 -25,0" fill="#fef08a"/>
  </g>
</svg>

